name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The build that matters: real AU/VST3 artifacts, validated by Apple's own
  # tool and by pluginval.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-macos-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: DSP tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate the Audio Unit
        run: |
          # COPY_PLUGIN_AFTER_BUILD installs into ~/Library/Audio/Plug-Ins;
          # nudge the registrar so auval sees it on a fresh runner.
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Spct Cwil

      - name: Validate the VST3 with pluginval
        run: |
          curl -sL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 8 \
            --validate-in-process \
            --timeout-ms 300000 \
            --validate "build/Spectroscope_artefacts/RelWithDebInfo/VST3/Spectroscope.vst3"

      # Uploading bundles directly does not work: actions/upload-artifact zips
      # them, and that zip drops the executable permission bit and breaks the
      # code signature. macOS then reports the result as "damaged and can't be
      # opened". Ad-hoc signing and wrapping in a tarball preserves both.
      - name: Package
        run: |
          cd build/Spectroscope_artefacts/RelWithDebInfo

          for bundle in AU/Spectroscope.component \
                        VST3/Spectroscope.vst3 \
                        Standalone/Spectroscope.app; do
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
          done

          tar czf "$GITHUB_WORKSPACE/spectroscope-macos.tar.gz" AU VST3 Standalone

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: spectroscope-macos
          path: spectroscope-macos.tar.gz

  # Fast compile check. Catches the class of error that would otherwise only
  # show up after a five-minute macOS build.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev \
            libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-linux-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: DSP tests
        run: ctest --test-dir build --output-on-failure
